[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nlp_sql_engine"]

[project]
name = "nlp-sql-engine"
version = "0.1.0"
description = "NLP to SQL Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.30",
    "sqlglot>=28.5.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "openai>=1.30.0",
]


[project.scripts]
engine = "nlp_sql_engine.app.main:main"
engine-ui = "nlp_sql_engine.web.app:run"


[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
